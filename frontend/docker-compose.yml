services:

  query-engine-suite-frontend:
    image: engineeringopsilab/query-engine-suite-frontend:latest
    build:
      context: .
      args:
        # "/" works for the port mapping below (the app is served at the root
        # of 127.0.0.1:4300). Change it to /query-engine-frontend/ only when
        # this sits behind a reverse proxy on that sub-path - and then the
        # proxy must NOT strip the prefix, or the asset URLs won't resolve.
        BASE_HREF: /query-engine-frontend/
    restart: always
    ports:
      - '127.0.0.1:4300:80'
    volumes:
      - ./src/assets/config.json:/usr/share/nginx/html/assets/config.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
