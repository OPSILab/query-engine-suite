version: "3.1"

services:

  query-engine-suite-frontend:
    image: engineeringopsilab/query-engine-suite-frontend:latest
    build:
      context: .
      args:
        BASE_HREF: /query-engine-frontend/
    restart: always
    ports:
      - '127.0.0.1:4300:80'
    volumes:
      - ./config.json:/usr/share/nginx/html/assets/config.json
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
