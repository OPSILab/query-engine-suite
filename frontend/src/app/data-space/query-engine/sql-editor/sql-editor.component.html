<div class="sql-editor">
  <div class="sql-editor__box">
    <!--
      Keep the <pre> contents on ONE line, with no whitespace between the
      @for braces and the <span>. Angular strips insignificant whitespace
      everywhere EXCEPT inside <pre>, so any line break or indentation here
      is rendered as real text: once per token, pushing the highlighted SQL
      out of alignment with the textarea above it (and, with enough tokens,
      below the visible part of the box). The Angular 21 control-flow
      migration reformatted this exact block that way.
      `track $index`, not `track tok`: tokens are positional, and every
      re-tokenize produces new objects, so identity tracking tore down and
      rebuilt every span on every keystroke.
    -->
    <pre class="sql-editor__highlight ds-mono" aria-hidden="true">@for (tok of tokens; track $index) {<span [style.color]="tok.color" [style.fontWeight]="tok.weight">{{ tok.text }}</span>}</pre>
    <textarea
      class="sql-editor__textarea ds-mono"
      spellcheck="false"
      [placeholder]="placeholder"
      [ngModel]="value"
      (ngModelChange)="onInput($event)"
    ></textarea>
  </div>

  @if (examples?.length) {
    <div class="sql-editor__examples">
      <label class="sql-editor__examples-label">
        {{ 'Example queries' | translate }}
        <button
          type="button"
          [dsTooltip]="'Click an example to insert it into the editor' | translate"
          class="ds-icon-button"
          aria-label="Info"
          >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
        </button>
      </label>
      <div class="sql-editor__example-list">
        @for (ex of examples; track ex) {
          <button
            type="button"
            class="sql-editor__example"
            [class.sql-editor__example--active]="value === ex.sql"
            [title]="ex.sql"
            (click)="useExample(ex.sql)"
          >{{ ex.label }}</button>
        }
      </div>
    </div>
  }
</div>
