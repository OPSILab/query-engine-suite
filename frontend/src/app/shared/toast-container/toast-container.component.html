<div class="ds-toast-stack" aria-live="polite">
  <div
    *ngFor="let t of toastService.toasts$ | async"
    class="ds-toast"
    [ngClass]="'ds-toast--' + t.status"
  >
    <svg class="ds-toast__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
    <div class="ds-toast__body">
      <div class="ds-toast__title">{{ t.title }}</div>
      <div class="ds-toast__message">{{ t.message }}</div>
    </div>
    <button type="button" class="ds-toast__close" (click)="toastService.dismiss(t.id)" aria-label="Dismiss">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
