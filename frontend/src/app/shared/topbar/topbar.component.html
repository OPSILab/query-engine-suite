<div class="ds-topbar">
  <div class="ds-topbar__inner">
    <div class="ds-topbar__start">
      @if (showMenuButton) {
      <button type="button" class="ds-topbar__menu" (click)="menuToggle.emit()" [attr.aria-expanded]="menuOpen"
        aria-controls="ds-sidenav" [attr.aria-label]="'Menu' | translate">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      }
      <a class="ds-topbar__brand" routerLink="/">
        @if (theme.theme === 'smartera') {
        <img class="ds-topbar__logo" src="assets/smart-era-logo.png" alt="SMART ERA" />
        <span class="ds-topbar__divider" aria-hidden="true"></span>
        }
        <img class="ds-topbar__logo" src="assets/icon_query_engine.png" alt="Query Engine Suite" />
        <span class="ds-topbar__divider" aria-hidden="true"></span>
        <div class="ds-topbar__title">
          <span class="ds-topbar__name">Data Space</span>
          <span class="ds-topbar__tag ds-mono">query engine</span>
        </div>
      </a>
    </div>
    <div class="ds-topbar__actions">
      <ng-content></ng-content>
    </div>
  </div>
</div>
