@if (shown.length) {
<div class="ds-site-notices" role="region" [attr.aria-label]="'Notices' | translate">
  @for (n of shown; track n.key) {
  <div class="ds-site-notice" [class.ds-site-notice--info]="n.level === 'info'" role="note">
    <svg class="ds-site-notice__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (n.level === 'info') {
      <circle cx="12" cy="12" r="9" /><path d="M12 8h.01M11 12h1v5h1" />
      } @else {
      <path d="M12 3 2 20h20L12 3z" /><path d="M12 10v4M12 17h.01" />
      }
    </svg>
    <p class="ds-site-notice__text">{{ n.text }}
      @if (n.link) {
      <a [href]="n.link.url" target="_blank" rel="noopener noreferrer">{{ n.link.text }}</a>
      }
    </p>
    <button type="button" class="ds-site-notice__close" (click)="close(n)" [attr.aria-label]="'Close' | translate" [title]="'Close' | translate">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
    </button>
  </div>
  }
</div>
}
