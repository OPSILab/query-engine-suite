name: Debug commit author (Query-Engine)

on:
  push:
    branches:
      - '**'  
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log last commit (branch)
        run: |
          echo "=== LAST COMMIT (branch) ==="
          git log -1 --pretty=fuller
          echo ""

      - name: Log last commit touching Query-Engine
        run: |
          echo "=== LAST COMMIT touching Query-Engine ==="
          git log -1 --pretty=fuller -- Query-Engine
          echo ""

      - name: Extract author info
        run: |
          echo "=== AUTHOR SUMMARY ==="

          LAST_AUTHOR_BRANCH=$(git log -1 --pretty=format:'%an')
          LAST_AUTHOR_QE=$(git log -1 --pretty=format:'%an' -- Query-Engine)

          LAST_HASH_BRANCH=$(git log -1 --pretty=format:'%H')
          LAST_HASH_QE=$(git log -1 --pretty=format:'%H' -- Query-Engine)

          echo "Branch last author        : $LAST_AUTHOR_BRANCH"
          echo "Query-Engine last author  : $LAST_AUTHOR_QE"
          echo "Branch last commit hash   : $LAST_HASH_BRANCH"
          echo "Query-Engine commit hash : $LAST_HASH_QE"

      - name: List files changed in last Query-Engine commit
        run: |
          echo "=== FILES CHANGED IN Query-Engine COMMIT ==="
          git show --name-only --pretty="" $(git log -1 --pretty=format:'%H' -- Query-Engine)
