name: Tests Query Engine

on:
  push:
    branches:
      - '**'
    paths:
      - 'Query-Engine/**'
      - '.github/workflows/tests-query-engine.yml'
  pull_request:
    paths:
      - 'Query-Engine/**'
      - '.github/workflows/tests-query-engine.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: Query-Engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Query-Engine/package-lock.json

      # Same compose file used locally (npm run test:db): MongoDB 4.4 on 27019 (GraphQL sources tests)
      - name: Start test database
        run: npm run test:db

      - name: Install
        run: npm ci

      # Simple search: the APIs / Orion / mapper are a local fake server started by the tests
      - name: Test
        run: npm test

      - name: Database logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Stop test database
        if: always()
        run: npm run test:db:down
